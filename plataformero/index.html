<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Platform Game</title>
</head>
<body>
<header>
    <a href="../">
        <h1 class="title">FRAV</h1>
    </a>
    <h1 class="name">PLATFORM GAME</h1>
</header>
    <main class="game">
        <h2>15 mundos por explorar</h2>
        <p class="instructions">Use the left and right arrow keys to move, Up to jump, and reach the flag to advance.</p>
        <p id="level-status" aria-live="polite">Level 1 of 15 — Reach the flag!</p>
        <canvas id="game-canvas" width="1200" height="675" aria-label="Platform game. Use the arrow keys to move and jump."></canvas>
    </main>
    <script src="main.js"></script>
</body>
</html>
