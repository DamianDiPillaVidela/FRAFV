<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Laberinto</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <a href="../" aria-label="Volver al inicio"><h1 class="title">FRAV</h1></a>
        <h1 class="name">El Laberinto</h1>
    </header>
    <main>
        <div id="game-area">
            <div class="game-stats" aria-label="Estado de la partida">
                <span>Nivel: <span id="level-count">1/10</span></span>
                <span>Tiempo: <span id="timer">0.00s</span></span>
                <span>Cristales: <span id="crystal-count">0/6</span></span>
                <span>Vidas: <span id="life-count">3</span></span>
                <button id="restart-button" type="button">Reiniciar</button>
            </div>
            <canvas id="game-canvas" width="900" height="600" aria-label="Laberinto. Usa las flechas del teclado para moverte.">
                Tu navegador no admite el elemento canvas necesario para jugar.
            </canvas>
            <div id="game-message" role="status" aria-live="polite">
                <div class="message-card">
                    <h2 id="message-title">El Laberinto</h2>
                    <p id="message-text">Recoge los cristales y llega a la salida.</p>
                    <button id="start-button" type="button">Empezar</button>
                </div>
            </div>
        </div>
        <p class="controls-hint">Usa las flechas del teclado para moverte</p>
    </main>
</body>
</html>
